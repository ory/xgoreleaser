name: Docker
run-name: Docker - golang ${{ inputs.golang }} - goreleaser ${{ inputs.goreleaser }}

on:
  workflow_dispatch:
    inputs:
      golang:
        description: GoLang Version
        required: true
      goreleaser:
        description: GoReleaser Version
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          go_version="${{ github.event.inputs.golang }}"
          goreleaser_version="${{ github.event.inputs.goreleaser }}"
          # Strip the "linux/" prefix in the shell; GitHub expressions have no
          # parameter expansion.
          arch="${PLATFORM##*/}"
          docker buildx build --push \
            --build-arg GO_VERSION=${go_version} --build-arg GORELEASER_VERSION=${goreleaser_version} \
            --platform "${PLATFORM}" \
            -t oryd/xgoreleaser:${go_version}-${goreleaser_version}-${arch} \
            .

  manifest:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # buildx pushes each per-arch tag as an index that carries a provenance
      # attestation, which `docker manifest create` rejects as a manifest list.
      # imagetools merges the indexes instead.
      - name: Create and push multi-arch manifests
        run: |
          go_version="${{ github.event.inputs.golang }}"
          goreleaser_version="${{ github.event.inputs.goreleaser }}"
          base="oryd/xgoreleaser"
          tag="${go_version}-${goreleaser_version}"

          docker buildx imagetools create \
            -t "${base}:${tag}" \
            -t "${base}:latest" \
            "${base}:${tag}-amd64" \
            "${base}:${tag}-arm64"
