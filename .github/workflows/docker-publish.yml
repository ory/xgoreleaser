name: Docker
run-name: Docker - golang ${{ inputs.golang }} - goreleaser ${{ inputs.goreleaser }}

on:
  workflow_dispatch:
    inputs:
      golang:
        description: GoLang Version
        required: true
      goreleaser:
        description: GoReleaser Version
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: arekkas
          password: ${{ secrets.DOCKER_SECRET_AREKKAS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          go_version="${{ github.event.inputs.golang }}"
          goreleaser_version="${{ github.event.inputs.goreleaser }}"
          arch="${{ matrix.platform##*/}}"
          docker buildx build --push \
            --build-arg GO_VERSION=${go_version} --build-arg GORELEASER_VERSION=${goreleaser_version} \
            --platform ${{ matrix.platform }} \
            -t oryd/xgoreleaser:${go_version}-${goreleaser_version}-${arch} \
            .

  manifest:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: arekkas
          password: ${{ secrets.DOCKER_SECRET_AREKKAS }}

      - name: Create and push multi-arch manifests
        run: |
          go_version="${{ github.event.inputs.golang }}"
          goreleaser_version="${{ github.event.inputs.goreleaser }}"
          base="oryd/xgoreleaser"
          tag="${go_version}-${goreleaser_version}"

          for manifest_tag in "${tag}" "latest"; do
            docker manifest create "${base}:${manifest_tag}" \
              "${base}:${tag}-amd64" \
              "${base}:${tag}-arm64"
            docker manifest push "${base}:${manifest_tag}"
          done
