version: 2

universal_binaries:
  - id: macos-cgo
    replace: false

builds:
  - id: macos-cgo
    flags:
      - "-tags=sqlite,hsm,json1"
    ldflags:
      - "-s -w -X {{.Var.buildinfo_tag}}={{.Tag}} -X {{.Var.buildinfo_hash}}={{.FullCommit}} -X {{.Var.buildinfo_date}}={{.Date}}"
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=1
      - CC=o64-clang
      - CXX=o64-clang++
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
    hooks:
      post:
        - cmd: cyclonedx-gomod app -licenses -json -output "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"
        - cmd: bash <(curl https://raw.githubusercontent.com/ory/xgoreleaser/master/rename.sh) "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"

  - id: linux-cgo-amd64
    flags:
      - "-tags=sqlite,hsm,json1"
    ldflags:
      - "-s -w -X {{.Var.buildinfo_tag}}={{.Tag}} -X {{.Var.buildinfo_hash}}={{.FullCommit}} -X {{.Var.buildinfo_date}}={{.Date}}"
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=1
    goarch:
      - amd64
    goos:
      - linux
    hooks:
      post:
        - cmd: cyclonedx-gomod app -licenses -json -output "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"
        - cmd: bash <(curl https://raw.githubusercontent.com/ory/xgoreleaser/master/rename.sh) "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"

  - id: linux-cgo-arm64
    flags:
      - "-tags=sqlite,hsm,json1"
    ldflags:
      - "-s -w -X {{.Var.buildinfo_tag}}={{.Tag}} -X {{.Var.buildinfo_hash}}={{.FullCommit}} -X {{.Var.buildinfo_date}}={{.Date}}"
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
    goarch:
      - arm64
    goos:
      - linux
    hooks:
      post:
        - cmd: cyclonedx-gomod app -licenses -json -output "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"
        - cmd: bash <(curl https://raw.githubusercontent.com/ory/xgoreleaser/master/rename.sh) "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"

  - id: linux-cgo-arm
    flags:
      - "-tags=sqlite,hsm,json1"
    ldflags:
      - "-s -w -X {{.Var.buildinfo_tag}}={{.Tag}} -X {{.Var.buildinfo_hash}}={{.FullCommit}} -X {{.Var.buildinfo_date}}={{.Date}}"
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=1
      - CC=arm-linux-gnueabihf-gcc
    goarch:
      - arm
    goarm:
      - 6
      - 7
    goos:
      - linux
    hooks:
      post:
        - cmd: cyclonedx-gomod app -licenses -json -output "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"
        - cmd: bash <(curl https://raw.githubusercontent.com/ory/xgoreleaser/master/rename.sh) "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"

  - id: alpine-cgo-amd64
    flags:
      - "-tags=sqlite,hsm,json1"
    ldflags:
      - "-s -w -X {{.Var.buildinfo_tag}}={{.Tag}} -X {{.Var.buildinfo_hash}}={{.FullCommit}} -X {{.Var.buildinfo_date}}={{.Date}}"
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=1
      - CC=musl-gcc
    goarch:
      - amd64
    goos:
      - linux
    hooks:
      post:
        - cmd: cyclonedx-gomod app -licenses -json -output "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"
        - cmd: bash <(curl https://raw.githubusercontent.com/ory/xgoreleaser/master/rename.sh) "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"

  - id: alpine-cgo-arm64
    flags:
      - -tags
      - sqlite
    ldflags:
      - "-s -w -X {{.Var.buildinfo_tag}}={{.Tag}} -X {{.Var.buildinfo_hash}}={{.FullCommit}} -X {{.Var.buildinfo_date}}={{.Date}}"
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-musl-gcc
    goarch:
      - arm64
    goos:
      - linux
    hooks:
      post:
        - cmd: cyclonedx-gomod app -licenses -json -output "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"
        - cmd: bash <(curl https://raw.githubusercontent.com/ory/xgoreleaser/master/rename.sh) "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"

  - id: alpine-cgo-arm
    flags:
      - -tags
      - sqlite
    ldflags:
      - "-s -w -X {{.Var.buildinfo_tag}}={{.Tag}} -X {{.Var.buildinfo_hash}}={{.FullCommit}} -X {{.Var.buildinfo_date}}={{.Date}}"
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=1
      - CC=arm-linux-musleabihf-gcc
    goarch:
      - arm
    goarm:
      - 6
      - 7
    goos:
      - linux
    hooks:
      post:
        - cmd: cyclonedx-gomod app -licenses -json -output "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"
        - cmd: bash <(curl https://raw.githubusercontent.com/ory/xgoreleaser/master/rename.sh) "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"

  - id: windows-cgo
    flags:
      - "-tags=sqlite,hsm,json1"
    ldflags:
      - "-s -w -X {{.Var.buildinfo_tag}}={{.Tag}} -X {{.Var.buildinfo_hash}}={{.FullCommit}} -X {{.Var.buildinfo_date}}={{.Date}}"
    binary: "{{ .ProjectName }}"
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
    goarch:
      - amd64
    goos:
      - windows
    hooks:
      post:
        - cmd: cyclonedx-gomod app -licenses -json -output "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"
        - cmd: bash <(curl https://raw.githubusercontent.com/ory/xgoreleaser/master/rename.sh) "./dist/{{ .ProjectName }}_{{ .Version }}_sqlite_{{ .Target }}.bom.json"

archives:
  - id: windows-cgo
    builds:
      - windows-cgo
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}-
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}
      {{- end }}_sqlite_
      {{- if eq .Arch "amd64" }}64bit
      {{- else if eq .Arch "386" }}32bit
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

  - id: macos-cgo
    builds:
      - macos-cgo
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}-
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}
      {{- end }}_sqlite_
      {{- if eq .Arch "amd64" }}64bit
      {{- else if eq .Arch "386" }}32bit
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

  - id: linux-cgo
    builds:
      - linux-cgo-arm64
      - linux-cgo-amd64
      - linux-cgo-arm
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}-
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}
      {{- end }}_sqlite_
      {{- if eq .Arch "amd64" }}64bit
      {{- else if eq .Arch "386" }}32bit
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

  - id: alpine-cgo
    builds:
      - alpine-cgo-amd64
      - alpine-cgo-arm64
      - alpine-cgo-arm
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}-
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}
      {{- end }}_sqlite_libmusl_
      {{- if eq .Arch "amd64" }}64bit
      {{- else if eq .Arch "386" }}32bit
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

brews:
  - name: "{{ .Var.brew_name }}"
    description: "{{ .Var.brew_description }}"
    license: "Apache-2.0"
    repository:
      owner: ory
      name: homebrew-tap
    goarm: 6
    test: |
      system "#{bin}/{{ .ProjectName }} version"
    ids:
      - linux-cgo
      - macos-cgo
    homepage: https://www.ory.sh
    commit_author:
      name: aeneasr
      email: 3372410+aeneasr@users.noreply.github.com

scoops:
  - ids: [ windows-cgo ]
    name: "{{ .ProjectName }}"
    repository:
      owner: ory
      name: scoop
    homepage: https://www.ory.sh
    commit_author:
      name: aeneasr
      email: 3372410+aeneasr@users.noreply.github.com
    commit_msg_template: "autogen: scoop update for {{ .ProjectName }} version {{ .Tag }}"

dockers:
  - image_templates:
      - "oryd/{{ .ProjectName }}:v{{ .Version }}-amd64"
    use: buildx
    dockerfile: "{{ .Var.dockerfile_alpine }}"
    goarch: amd64
    ids:
      - alpine-cgo-amd64
    build_flag_templates:
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.vendor=Ory"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.url=https://www.ory.sh"
      - "--label=org.opencontainers.image.documentation=https://www.ory.sh/docs"
      - "--platform=linux/amd64"

  - image_templates:
      - "oryd/{{ .ProjectName }}:v{{ .Version }}-arm64"
    use: buildx
    goarch: arm64
    dockerfile: "{{ .Var.dockerfile_alpine }}"
    ids:
      - alpine-cgo-arm64
    build_flag_templates:
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.vendor=Ory"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.url=https://www.ory.sh"
      - "--label=org.opencontainers.image.documentation=https://www.ory.sh/docs"
      - "--platform=linux/arm64/v8"

  - image_templates:
      - "oryd/{{ .ProjectName }}:v{{ .Version }}-armv7"
    use: buildx
    goarch: arm
    goarm: 7
    dockerfile: "{{ .Var.dockerfile_alpine }}"
    ids:
      - alpine-cgo-arm
    build_flag_templates:
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.vendor=Ory"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.url=https://www.ory.sh"
      - "--label=org.opencontainers.image.documentation=https://www.ory.sh/docs"
      - "--platform=linux/arm/v7"

  - image_templates:
      - "oryd/{{ .ProjectName }}:v{{ .Version }}-armv6"
    use: buildx
    goarch: arm
    goarm: 6
    dockerfile: "{{ .Var.dockerfile_alpine }}"
    ids:
      - linux-cgo-arm
    build_flag_templates:
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.vendor=Ory"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.url=https://www.ory.sh"
      - "--label=org.opencontainers.image.documentation=https://www.ory.sh/docs"
      - "--platform=linux/arm/v6"

docker_manifests:
  - id: tag
    name_template: "oryd/{{ .ProjectName }}:{{ .Tag }}"
    image_templates:
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-amd64"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-arm64"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-armv7"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-armv6"

  - id: major
    name_template: "oryd/{{ .ProjectName }}:v{{ .Major }}"
    skip_push: auto
    image_templates:
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-amd64"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-arm64"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-armv7"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-armv6"

  - id: minor
    name_template: "oryd/{{ .ProjectName }}:v{{ .Major }}.{{ .Minor }}"
    skip_push: auto
    image_templates:
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-amd64"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-arm64"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-armv7"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-armv6"

  - id: patch
    name_template: "oryd/{{ .ProjectName }}:v{{ .Major }}.{{ .Minor }}.{{ .Patch }}"
    skip_push: auto
    image_templates:
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-amd64"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-arm64"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-armv7"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-armv6"

  - id: latest
    name_template: "oryd/{{ .ProjectName }}:latest"
    skip_push: auto
    image_templates:
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-amd64"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-arm64"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-armv7"
      - "oryd/{{ .ProjectName }}:{{ .Tag }}-armv6"
